; SoftMap 設定ファイル（サンプル）

[software]
source = registry

[tree]
; 走査対象ドライブ（省略時は接続中の固定ドライブを自動検出）
; 特定ドライブだけにする場合は明示する（例: drives = E:\）
; drives = auto

; 除外は組み込みデフォルトに追加される（置き換えではない）
; exclude = MyTemp

; 記録粒度: all_files（全体保存・デフォルト）| folders_and_apps（軽量）
depth = all_files

; report の詳細（--software / --checklist 等）は CLI フラグでオプトイン。
; 設定でデフォルト強制しない。

[output]
format = binary
compress = true
